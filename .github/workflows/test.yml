name: test

# Added after a Windows-only test bug shipped and stayed shipped for a
# release, because nothing ran `npm test` on push. Keep this in step with
# jev-web's workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # 20 and 22 only, matching jev-web. The suite is pure node --test with
      # no version-sensitive APIs, so extra matrix legs buy little and this
      # account's Actions runners occasionally get cancelled mid-run, which
      # reddens the whole check for no real signal.