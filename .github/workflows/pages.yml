name: deploy demo

# Two builds: the static page, then the chat WebWorker (Vite cannot statically
# resolve `new Worker(url || new URL('./worker.js', import.meta.url))` inside
# src/chat/SiteChat.js, so the worker ships as its own bundle).
on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "src/**"
      - "vite.demo.config.js"
      - "vite.worker.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build demo (page + chat worker)
        run: npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
